server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 🟢 反向代理：/api/ 轉發到後端，讓瀏覽器變成同源請求，徹底避開 CORS
    #
    # ⚠️ 關鍵：用「變數 + Docker 內建 DNS(127.0.0.11)」讓 nginx 改成「請求時」才解析後端主機名，
    #    而不是「啟動時」。否則後端一旦晚啟動或重建，nginx 會因 "host not found in upstream"
    #    直接啟動失敗退出。
    # ⚠️ 用變數 proxy_pass 時 nginx 不會自動去掉 location 前綴，故用 regex 擷取 $1 手動轉發，
    #    並用 $is_args$args 保留 query string。/api/machines -> http://backend:8000/machines
    location ~ ^/api/(.*)$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream backend;
        proxy_pass http://$upstream:8000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback：找不到對應檔案時交由 index.html (React Router) 處理
    location / {
        try_files $uri $uri/ /index.html;
    }
}
