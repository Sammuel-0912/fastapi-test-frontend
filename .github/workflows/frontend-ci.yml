name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 安裝相依套件 (Clean Install)
        run: npm ci

      - name: 🏗️ 建置專案與型別檢查 (Build & Typecheck)
        run: npm run build

      - name: 🧪 單元測試
        run: npm test

      - name: 🎭 安裝 Playwright 瀏覽器
        run: npx playwright install --with-deps chromium

      - name: 🔺 E2E
        env:
          E2E_BASE_URL: http://localhost:4173
        run: npm run e2e

      - name: 📤 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 🟢 新增：測試與 Build 通過後，打包前端 Docker Image 並推送到 GHCR
  build-image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 檢出程式碼 (Checkout)
        uses: actions/checkout@v4

      - name: 🔑 登入 GHCR (GitHub Container Registry)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 建置並推送前端 Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}