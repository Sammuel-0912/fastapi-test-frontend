name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出程式碼 (Checkout)
        uses: actions/checkout@v4
      
      - name: ⚙️ 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      
      - name: 📦 安裝相依套件 (Clean Install)
        run: npm ci
      
      - name: 🏗️ 建置專案與型別檢查 (Build & Typecheck)
        run: npm run build
      
      # 🟢 1. 補跑 12 個 Vitest 單元測試
      - name: 🧪 單元測試
        run: npm test
      # 🟢 2. 安裝 Chromium 與 Linux 系統核心依賴 (libnss3 等)
      - name: 🎭 安裝 Playwright 瀏覽器
      - run: npx playwright install --with-deps chromium

      # 🟢 3. 執行 E2E 測試，將 baseURL 指向 preview 的 4173 port
      - name: 🔺 E2E
        env:
          E2E_BASE_URL: http://localhost:4173
        run: npm run e2e