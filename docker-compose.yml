services:
  backend:
    build:
      context: ../fastapi-test
    env_file:
      - ../fastapi-test/.env
    environment:
      # 🟢 四條斜線表示絕對路徑：/code/data/factory.db
      - DATABASE_URL=sqlite+aiosqlite:////code/data/factory.db
    # 🟢 SQLite 資料持久化：把 /code/data 掛到 named volume，重建容器資料不消失
    volumes:
      - backend-db:/code/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
  frontend:
    build: .
    ports:
      - "5173:80"
    environment:
      # 🟢 改用相對路徑，讓前端打到 nginx 的 /api 反向代理（同源，無 CORS）
      - API_BASE_URL=/api
    # 🟢 等後端健康檢查通過才啟動，確保 nginx 代理目標可用
    depends_on:
      backend:
        condition: service_healthy

# 🟢 具名 volume：儲存後端 SQLite 資料庫檔
volumes:
  backend-db:
